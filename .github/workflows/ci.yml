name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Valeurs factices suffisantes pour un build de vérification CI
          DATABASE_URL: "postgresql://user:password@localhost:5432/adressa"
          NEXTAUTH_SECRET: "ci-build-secret"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
